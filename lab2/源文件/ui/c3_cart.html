<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>C3 购物车</title>
<link rel="stylesheet" href="styles.css"></head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span class="icons">
    <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
    <svg width="16" height="11" viewBox="0 0 16 11" fill="currentColor"><path d="M8 10.2 5.6 7.8a3.4 3.4 0 0 1 4.8 0L8 10.2Zm-3.7-3.7L2.6 4.7a7.7 7.7 0 0 1 10.8 0l-1.7 1.8a5.3 5.3 0 0 0-7.4 0Z"/></svg>
    <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x="0.5" y="0.5" width="20" height="10" rx="2.5" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="15" height="7" rx="1.5" fill="currentColor"/><path d="M22.5 4v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".6"/></svg>
  </span></div>

  <div class="nav">
    <div class="icon-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></div>
    <div class="title">购物车</div>
    <div class="spacer"></div>
    <div class="s" style="color:var(--sub)">编辑</div>
  </div>

  <div class="body" style="padding:12px 14px 150px;overflow:hidden">
    <div class="row between" style="padding:0 2px 8px">
      <div class="row gap8">
        <span class="tag gray">食刻·砂锅饭（南苑店）</span>
      </div>
      <span class="xs faint">只保留同一店铺商品</span>
    </div>

    <div class="alert warn" style="margin-bottom:10px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 8v5M12 16.5v.5"/><circle cx="12" cy="12" r="9"/></svg>
      <span><b>价格变动：</b>招牌腊味煲仔饭（大份）已由 <b>¥18.00</b> 上调为 <b>¥20.00</b>，确认后按新价结算。</span>
    </div>

    <div class="card" style="padding:0 12px">
      <!-- 商品 1 -->
      <div class="row gap10" style="padding:14px 0">
        <div style="width:20px;height:20px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center;flex:none">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9.5 18 20 6.5"/></svg>
        </div>
        <div class="thumb t1" style="width:60px;height:60px;font-size:16px">煲</div>
        <div style="flex:1;min-width:0">
          <div class="h3">招牌腊味煲仔饭</div>
          <div class="xs faint" style="margin-top:3px">大份 · 微辣</div>
          <div class="between" style="margin-top:6px">
            <div class="row gap6">
              <span class="price"><span class="cny">¥</span><span class="num" style="font-size:16px">20.00</span></span>
              <span class="xs strike">¥18.00</span>
            </div>
            <div class="stepper"><button class="minus">−</button><span class="n">2</span><button class="plus">＋</button></div>
          </div>
        </div>
      </div>
      <div class="divider"></div>
      <!-- 商品 2 -->
      <div class="row gap10" style="padding:14px 0">
        <div style="width:20px;height:20px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center;flex:none">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9.5 18 20 6.5"/></svg>
        </div>
        <div class="thumb t2" style="width:60px;height:60px;font-size:16px">鸡</div>
        <div style="flex:1;min-width:0">
          <div class="h3">香菇滑鸡饭</div>
          <div class="xs faint" style="margin-top:3px">小份 · 不辣</div>
          <div class="between" style="margin-top:6px">
            <span class="price"><span class="cny">¥</span><span class="num" style="font-size:16px">16.00</span></span>
            <div class="stepper"><button class="minus">−</button><span class="n">1</span><button class="plus">＋</button></div>
          </div>
        </div>
      </div>
      <div class="divider"></div>
      <!-- 售罄 -->
      <div class="row gap10" style="padding:14px 0;opacity:.62">
        <div style="width:20px;height:20px;border-radius:50%;border:1.6px solid #d7dbe3;flex:none"></div>
        <div class="thumb t6" style="width:60px;height:60px;font-size:16px">汤</div>
        <div style="flex:1;min-width:0">
          <div class="row gap6"><span class="h3">例汤（例）</span><span class="tag gray" style="height:18px">已售罄</span></div>
          <div class="xs faint" style="margin-top:3px">该菜品已售完，本行不可选中</div>
          <div class="between" style="margin-top:6px">
            <span class="price" style="color:var(--faint)"><span class="cny">¥</span><span class="num" style="font-size:16px">3.00</span></span>
            <div class="stepper"><button class="minus" style="background:#f4f5f8">−</button><span class="n" style="color:var(--faint)">1</span><button class="plus" style="background:#e9ebef;color:#fff">＋</button></div>
          </div>
        </div>
      </div>
    </div>

    <div class="xs faint" style="margin:10px 2px 0;line-height:1.7">
      · 数量减到 0 即从购物车移除，单行最多 99 份<br>
      · 加入其他店铺菜品前需先结算或清空当前店铺商品
    </div>
  </div>

  <div class="bottombar" style="bottom:0">
    <div class="row gap8">
      <div style="width:20px;height:20px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9.5 18 20 6.5"/></svg>
      </div>
      <span class="s">全选</span>
    </div>
    <div style="flex:1;text-align:right">
      <div class="price"><span class="cny">¥</span><span class="num" style="font-size:22px">56.00</span></div>
      <div class="xs faint">不含配送费 ¥2.00</div>
    </div>
    <button class="btn primary" style="width:132px">去结算(3)</button>
  </div>
</div>
</body></html>
