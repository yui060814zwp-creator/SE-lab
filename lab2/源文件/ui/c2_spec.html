<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>C2 规格选择</title>
<link rel="stylesheet" href="styles.css"></head>
<body>
<div class="phone">
  <!-- 背景：店铺页（变暗） -->
  <div class="body" style="filter:saturate(.9)">
    <div style="height:120px;background:linear-gradient(135deg,#ff9a4d,#ff6b2c);position:relative">
      <div class="statusbar light"><span>9:41</span><span class="icons">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
        <svg width="16" height="11" viewBox="0 0 16 11" fill="currentColor"><path d="M8 10.2 5.6 7.8a3.4 3.4 0 0 1 4.8 0L8 10.2Zm-3.7-3.7L2.6 4.7a7.7 7.7 0 0 1 10.8 0l-1.7 1.8a5.3 5.3 0 0 0-7.4 0Z"/></svg>
        <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x="0.5" y="0.5" width="20" height="10" rx="2.5" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="15" height="7" rx="1.5" fill="currentColor"/><path d="M22.5 4v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".6"/></svg>
      </span></div>
      <div class="nav transparent" style="height:44px">
        <div class="icon-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></div>
      </div>
      <div style="padding:0 18px;color:#fff">
        <div style="font-size:20px;font-weight:800">食刻·砂锅饭</div>
        <div style="font-size:12px;opacity:.9;margin-top:4px">营业中 · 约 28 分钟 · 起送 ¥15</div>
      </div>
    </div>
    <div style="padding:14px 14px 0">
      <div class="card" style="padding:12px">
        <div class="row gap12">
          <div class="thumb t1" style="width:64px;height:64px;font-size:18px">煲</div>
          <div><div class="h3">招牌腊味煲仔饭</div><div class="xs muted" style="margin-top:3px">腊肠、腊肉、青菜</div>
            <div class="price" style="margin-top:4px"><span class="cny">¥</span><span class="num">18</span><span class="xs faint" style="margin-left:4px;font-weight:400">起</span></div>
          </div>
        </div>
      </div>
      <div class="card" style="padding:12px;margin-top:10px">
        <div class="row gap12">
          <div class="thumb t2" style="width:64px;height:64px;font-size:18px">鸡</div>
          <div><div class="h3">香菇滑鸡饭</div><div class="xs muted" style="margin-top:3px">鲜香菇、鸡腿肉</div>
            <div class="price" style="margin-top:4px"><span class="cny">¥</span><span class="num">16</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="sheet-mask"></div>

  <!-- 规格选择弹层 -->
  <div class="sheet" style="height:474px">
    <div class="handle"></div>
    <div style="padding:6px 18px 0">
      <div class="between">
        <div class="row gap12">
          <div class="thumb t1" style="width:56px;height:56px;font-size:16px;border-radius:12px">煲</div>
          <div>
            <div class="h2">招牌腊味煲仔饭</div>
            <div class="price" style="margin-top:4px"><span class="cny">¥</span><span class="num">18</span><span class="xs faint" style="margin-left:5px;font-weight:400">月售 486</span></div>
          </div>
        </div>
        <div style="color:#c4cad4;font-size:20px;line-height:1">×</div>
      </div>

      <div style="height:1px;background:var(--line);margin:14px 0"></div>

      <div class="between">
        <span class="h3">份量</span>
        <span class="xs faint">价格按规格计价</span>
      </div>
      <div class="row gap8" style="margin-top:9px">
        <div style="padding:8px 14px;border-radius:10px;background:var(--brand-soft);border:1.5px solid var(--brand);color:var(--brand);font-size:13px;font-weight:700">大份 ¥18</div>
        <div style="padding:8px 14px;border-radius:10px;background:#f4f5f8;color:#b3b9c3;font-size:13px;display:flex;align-items:center;gap:6px">
          小份 ¥16 <span class="tag gray" style="height:17px;font-size:10px">售罄</span>
        </div>
      </div>

      <div class="between" style="margin-top:16px">
        <span class="h3">辣度</span>
        <span class="xs faint">必选</span>
      </div>
      <div class="row gap8" style="margin-top:9px">
        <div style="padding:7px 13px;border-radius:9px;background:#f4f5f8;font-size:13px;color:var(--ink-2)">不辣</div>
        <div style="padding:7px 13px;border-radius:9px;background:var(--brand-soft);border:1.5px solid var(--brand);color:var(--brand);font-size:13px;font-weight:700">微辣</div>
        <div style="padding:7px 13px;border-radius:9px;background:#f4f5f8;font-size:13px;color:var(--ink-2)">中辣</div>
        <div style="padding:7px 13px;border-radius:9px;background:#f4f5f8;font-size:13px;color:var(--ink-2)">特辣</div>
      </div>

      <div class="between" style="margin-top:18px">
        <span class="h3">数量</span>
        <div class="stepper">
          <button class="minus">−</button><span class="n">2</span><button class="plus">＋</button>
        </div>
      </div>
      <div class="xs faint" style="margin-top:6px">已选：大份 · 微辣 · 库存 7 份（单行最多 99 份）</div>
    </div>

    <div style="position:absolute;left:0;right:0;bottom:0;padding:12px 18px 20px;border-top:1px solid var(--line);background:#fff">
      <div class="row gap12">
        <div style="flex:1">
          <div class="price"><span class="cny">¥</span><span class="num" style="font-size:22px">36.00</span></div>
          <div class="xs faint">2 份 · 不含配送费</div>
        </div>
        <button class="btn primary" style="width:190px">加入购物车</button>
      </div>
      <div class="xs faint" style="margin-top:8px;text-align:center">不同规格分别计价，加购后可在购物车修改数量</div>
    </div>
  </div>
</div>
</body></html>
