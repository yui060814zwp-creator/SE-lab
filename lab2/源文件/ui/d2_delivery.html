<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>D2 配送执行</title>
<link rel="stylesheet" href="styles.css"></head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span class="icons">
    <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
    <svg width="16" height="11" viewBox="0 0 16 11" fill="currentColor"><path d="M8 10.2 5.6 7.8a3.4 3.4 0 0 1 4.8 0L8 10.2Zm-3.7-3.7L2.6 4.7a7.7 7.7 0 0 1 10.8 0l-1.7 1.8a5.3 5.3 0 0 0-7.4 0Z"/></svg>
    <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x="0.5" y="0.5" width="20" height="10" rx="2.5" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="15" height="7" rx="1.5" fill="currentColor"/><path d="M22.5 4v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".6"/></svg>
  </span></div>

  <div class="nav">
    <div class="icon-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></div>
    <div class="title">配送中</div>
    <div class="spacer"></div>
    <div class="tag info" style="height:21px">已接单 8 分钟</div>
  </div>

  <div class="body" style="padding:12px 14px 0;overflow:hidden">
    <!-- 路线示意 -->
    <div class="card" style="padding:0;overflow:hidden">
      <div style="height:132px;background:linear-gradient(160deg,#eef4ff,#e6f7ef);position:relative">
        <svg width="100%" height="132" viewBox="0 0 358 132" preserveAspectRatio="none">
          <path d="M40 104 C 110 104, 108 40, 190 40 S 300 52, 318 30" stroke="#b9c9e6" stroke-width="6" fill="none" stroke-linecap="round"/>
          <path d="M40 104 C 110 104, 108 40, 190 40 S 300 52, 318 30" stroke="#2e90fa" stroke-width="2.4" stroke-dasharray="7 6" fill="none"/>
        </svg>
        <div style="position:absolute;left:26px;bottom:18px;display:flex;align-items:center;gap:6px">
          <div style="width:22px;height:22px;border-radius:50%;background:var(--ok);display:flex;align-items:center;justify-content:center">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20H4z"/></svg>
          </div>
          <span class="xs" style="font-weight:700;color:#0b6b42">取餐点</span>
        </div>
        <div style="position:absolute;right:22px;top:14px;display:flex;align-items:center;gap:6px">
          <span class="xs" style="font-weight:700;color:#b54707">送达点</span>
          <div style="width:22px;height:22px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11Z"/></svg>
          </div>
        </div>
      </div>
      <div style="padding:10px 14px;display:flex;justify-content:space-between" class="xs muted">
        <span>距送达点 1.2km</span><span>预计 9 分钟</span><span>¥4.50</span>
      </div>
    </div>

    <!-- 订单信息 -->
    <div class="card" style="padding:14px;margin-top:10px">
      <div class="between">
        <span class="tag brand" style="height:20px">取餐码 A12</span>
        <span class="xs" style="font-family:Consolas,monospace;color:var(--sub)">SC20261024183201</span>
      </div>
      <div class="between" style="margin-top:12px">
        <div>
          <div class="xs faint">取货</div>
          <div class="s" style="font-weight:700;margin-top:2px">食刻·砂锅饭（南苑店）</div>
          <div class="xs faint" style="margin-top:2px">南苑食堂 2 楼</div>
        </div>
        <div style="width:34px;height:34px;border-radius:50%;background:var(--ok-soft);display:flex;align-items:center;justify-content:center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ok)" stroke-width="2.2" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z"/></svg>
        </div>
      </div>
      <div class="divider" style="margin:12px 0"></div>
      <div class="xs faint">送达</div>
      <div class="s" style="font-weight:700;margin-top:2px">学生公寓 6 栋 508 室</div>
      <div class="xs muted" style="margin-top:2px">周同学 · 138****5678 · 放门口</div>
      <div class="alert info" style="margin-top:10px;padding:7px 10px">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 9v4"/><circle cx="12" cy="16.4" r=".9" fill="currentColor" stroke="none"/></svg>
        <span>完整地址仅在"已接单—配送中"期间可见，送达 1 小时后自动不可见</span>
      </div>
    </div>

    <!-- 操作 -->
    <div style="margin-top:12px;display:flex;flex-direction:column;gap:9px">
      <div class="row gap10">
        <button class="btn primary" style="flex:1;height:44px">已到店取餐</button>
        <button class="btn ghost" style="flex:1;height:44px">联系顾客</button>
      </div>
      <div class="row gap10">
        <button class="btn" style="flex:1;height:44px;background:#e8f8f0;color:#0b6b42">已送达</button>
        <button class="btn danger-ghost" style="flex:1;height:44px">配送失败</button>
      </div>
      <div class="row between" style="padding:2px 4px">
        <span class="xs faint">送达后订单完成并记录时间戳</span>
        <span class="s" style="color:var(--info);font-weight:700">顾客改为自取 ›</span>
      </div>
    </div>

    <div class="xs faint" style="margin:12px 2px 0;line-height:1.7">
      · 配送失败须选择原因（联系不上／地址错误／顾客拒收／其他），确认后订单取消并全额退款<br>
      · 改为自取不退款，订单继续流转至完成，配送单作废并记录原因
    </div>
  </div>
</div>
</body></html>
