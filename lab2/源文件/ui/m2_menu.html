<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>M2 菜品管理</title>
<link rel="stylesheet" href="styles.css"></head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span class="icons">
    <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
    <svg width="16" height="11" viewBox="0 0 16 11" fill="currentColor"><path d="M8 10.2 5.6 7.8a3.4 3.4 0 0 1 4.8 0L8 10.2Zm-3.7-3.7L2.6 4.7a7.7 7.7 0 0 1 10.8 0l-1.7 1.8a5.3 5.3 0 0 0-7.4 0Z"/></svg>
    <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x="0.5" y="0.5" width="20" height="10" rx="2.5" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="15" height="7" rx="1.5" fill="currentColor"/><path d="M22.5 4v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".6"/></svg>
  </span></div>

  <div class="nav">
    <div class="icon-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></div>
    <div class="title">菜品与规格</div>
    <div class="spacer"></div>
    <div class="s" style="color:var(--brand);font-weight:700">＋ 新增</div>
  </div>

  <div class="body" style="padding:12px 14px 88px;overflow:hidden">
    <div class="row gap8" style="margin-bottom:10px">
      <span class="tag brand" style="height:26px;padding:0 10px">饭类 4</span>
      <span class="tag line" style="height:26px;padding:0 10px">汤羹 1</span>
      <span class="tag line" style="height:26px;padding:0 10px">加料 2</span>
      <div style="flex:1"></div>
      <span class="tag gray" style="height:26px">排序</span>
    </div>

    <!-- 菜品 1 -->
    <div class="card" style="padding:12px">
      <div class="row gap10">
        <div class="thumb t1" style="width:58px;height:58px;font-size:15px">煲</div>
        <div style="flex:1;min-width:0">
          <div class="row gap6"><span class="s" style="font-weight:800">招牌腊味煲仔饭</span><span class="tag brand" style="height:17px;font-size:10px">招牌</span></div>
          <div class="xs faint" style="margin-top:4px">大份 ¥18.00 · 库存 7 ｜ 小份 ¥16.00 · 库存 0</div>
          <div class="row gap6" style="margin-top:6px">
            <span class="tag ok" style="height:18px">已上架</span>
            <span class="tag gray" style="height:18px">小份售罄</span>
          </div>
        </div>
        <div style="width:42px;height:24px;border-radius:12px;background:var(--brand);display:flex;align-items:center;justify-content:flex-end;padding:2px">
          <div style="width:20px;height:20px;border-radius:50%;background:#fff"></div>
        </div>
      </div>
    </div>

    <!-- 菜品 2 -->
    <div class="card" style="padding:12px;margin-top:10px">
      <div class="row gap10">
        <div class="thumb t2" style="width:58px;height:58px;font-size:15px">鸡</div>
        <div style="flex:1;min-width:0">
          <div class="s" style="font-weight:800">香菇滑鸡饭</div>
          <div class="xs faint" style="margin-top:4px">大份 ¥16.00 · 库存 12 ｜ 小份 ¥14.00 · 库存 9</div>
          <div class="row gap6" style="margin-top:6px">
            <span class="tag ok" style="height:18px">已上架</span>
            <span class="tag line" style="height:18px">改价记录 2 条</span>
          </div>
        </div>
        <div style="width:42px;height:24px;border-radius:12px;background:var(--brand);display:flex;align-items:center;justify-content:flex-end;padding:2px">
          <div style="width:20px;height:20px;border-radius:50%;background:#fff"></div>
        </div>
      </div>
    </div>

    <!-- 菜品 3：下架 -->
    <div class="card" style="padding:12px;margin-top:10px;opacity:.78">
      <div class="row gap10">
        <div class="thumb t6" style="width:58px;height:58px;font-size:15px">梅</div>
        <div style="flex:1;min-width:0">
          <div class="s" style="font-weight:800">梅菜肉饼饭</div>
          <div class="xs faint" style="margin-top:4px">大份 ¥15.00 · 库存 0</div>
          <div class="row gap6" style="margin-top:6px">
            <span class="tag gray" style="height:18px">已下架</span>
            <span class="tag warn" style="height:18px">有历史订单，仅可下架</span>
          </div>
        </div>
        <div style="width:42px;height:24px;border-radius:12px;background:#e5e8ee;display:flex;align-items:center;justify-content:flex-start;padding:2px">
          <div style="width:20px;height:20px;border-radius:50%;background:#fff"></div>
        </div>
      </div>
    </div>

    <div class="alert info" style="margin-top:12px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 9v4"/><circle cx="12" cy="16.4" r=".9" fill="currentColor" stroke="none"/></svg>
      <span>价格挂在规格上，菜品展示价为可选规格中的最低价；改动不影响已支付订单的价格快照。</span>
    </div>

    <div class="card" style="padding:12px;margin-top:10px">
      <div class="between"><span class="s" style="font-weight:700">营业时间</span><span class="xs muted">10:30–13:30、16:30–20:30</span></div>
      <div class="between" style="margin-top:8px"><span class="s" style="font-weight:700">配送半径</span><span class="xs muted">3.0 km</span></div>
      <div class="between" style="margin-top:8px"><span class="s" style="font-weight:700">起送价 / 配送费</span><span class="xs muted">¥15.00 / ¥2.00</span></div>
    </div>
  </div>

  <div class="bottombar">
    <button class="btn primary block">＋ 新建菜品</button>
  </div>
</div>
</body></html>
