<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>C6 订单列表</title>
<link rel="stylesheet" href="styles.css"></head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span class="icons">
    <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
    <svg width="16" height="11" viewBox="0 0 16 11" fill="currentColor"><path d="M8 10.2 5.6 7.8a3.4 3.4 0 0 1 4.8 0L8 10.2Zm-3.7-3.7L2.6 4.7a7.7 7.7 0 0 1 10.8 0l-1.7 1.8a5.3 5.3 0 0 0-7.4 0Z"/></svg>
    <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x="0.5" y="0.5" width="20" height="10" rx="2.5" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="15" height="7" rx="1.5" fill="currentColor"/><path d="M22.5 4v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".6"/></svg>
  </span></div>

  <div class="nav">
    <div class="icon-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></div>
    <div class="title">我的订单</div>
    <div class="spacer"></div>
    <div class="s" style="color:var(--sub)">筛选</div>
  </div>

  <div class="body" style="padding-bottom:58px;overflow:hidden">
    <div style="display:flex;gap:18px;padding:12px 16px 10px;background:#fff;border-bottom:1px solid var(--line);font-size:13.5px;font-weight:700;color:var(--sub)">
      <span style="color:var(--brand);position:relative">全部<span style="position:absolute;left:50%;transform:translateX(-50%);bottom:-11px;width:18px;height:3px;border-radius:2px;background:var(--brand)"></span></span>
      <span>待接单</span><span>制作中</span><span>配送中</span><span>已完成</span>
    </div>

    <div style="padding:12px 14px 0">
      <!-- 待接单 -->
      <div class="card" style="padding:14px">
        <div class="between">
          <div class="row gap8">
            <div class="thumb t1" style="width:26px;height:26px;font-size:11px;border-radius:7px">食</div>
            <span class="s" style="font-weight:700">食刻·砂锅饭（南苑店）</span>
          </div>
          <span class="tag brand" style="height:20px">待接单</span>
        </div>
        <div class="row gap10" style="margin-top:10px">
          <div class="thumb t1" style="width:56px;height:56px;font-size:15px">煲</div>
          <div style="flex:1">
            <div class="s" style="font-weight:700">招牌腊味煲仔饭 等 3 件</div>
            <div class="xs faint" style="margin-top:3px">18:32 下单 · 预计 19:05 送达</div>
          </div>
          <div style="text-align:right"><div class="s" style="font-weight:800">¥58.00</div><div class="xs faint">已支付</div></div>
        </div>
        <div class="alert warn" style="margin-top:10px;padding:7px 10px">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg>
          <span>商家 5 分钟内未接单将自动取消并全额退款</span>
        </div>
        <div class="row gap10" style="margin-top:12px">
          <button class="btn ghost sm" style="flex:1;height:34px">联系商家</button>
          <button class="btn soft sm" style="flex:1;height:34px">申请退款</button>
        </div>
      </div>

      <!-- 配送中 -->
      <div class="card" style="padding:14px;margin-top:12px">
        <div class="between">
          <div class="row gap8">
            <div class="thumb t2" style="width:26px;height:26px;font-size:11px;border-radius:7px">食</div>
            <span class="s" style="font-weight:700">食刻·砂锅饭（南苑店）</span>
          </div>
          <span class="tag info" style="height:20px">配送中</span>
        </div>
        <div class="row gap10" style="margin-top:10px">
          <div class="thumb t2" style="width:56px;height:56px;font-size:15px">鸡</div>
          <div style="flex:1">
            <div class="s" style="font-weight:700">香菇滑鸡饭 等 2 件</div>
            <div class="xs faint" style="margin-top:3px">骑手张师傅已取餐，预计 12:35 送达</div>
          </div>
          <div style="text-align:right"><div class="s" style="font-weight:800">¥36.00</div><div class="xs faint">已完成支付</div></div>
        </div>
        <div class="row gap10" style="margin-top:12px">
          <button class="btn ghost sm" style="flex:1;height:34px">联系骑手</button>
          <button class="btn primary sm" style="flex:1;height:34px">查看进度</button>
        </div>
      </div>

      <!-- 已完成 -->
      <div class="card" style="padding:14px;margin-top:12px;opacity:.92">
        <div class="between">
          <div class="row gap8">
            <div class="thumb t6" style="width:26px;height:26px;font-size:11px;border-radius:7px">食</div>
            <span class="s" style="font-weight:700">食刻·砂锅饭（南苑店）</span>
          </div>
          <span class="tag gray" style="height:20px">已完成</span>
        </div>
        <div class="row gap10" style="margin-top:10px">
          <div class="thumb t1" style="width:56px;height:56px;font-size:15px">煲</div>
          <div style="flex:1">
            <div class="s" style="font-weight:700">番茄牛腩饭 等 2 件</div>
            <div class="xs faint" style="margin-top:3px">10-23 12:20 送达 · 共 32 分钟</div>
          </div>
          <div style="text-align:right"><div class="s" style="font-weight:800">¥38.00</div><div class="xs faint">已退款 ¥0.00</div></div>
        </div>
        <div class="row gap10" style="margin-top:12px">
          <button class="btn ghost sm" style="flex:1;height:34px">删除订单</button>
          <button class="btn ghost sm" style="flex:1;height:34px">再来一单</button>
        </div>
      </div>

      <div class="xs faint" style="text-align:center;margin:14px 0">仅展示近 90 天订单，更早订单请按订单号查询</div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>
      <span>首页</span>
    </div>
    <div class="tab on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1Z"/></svg>
      <span>订单</span>
    </div>
    <div class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>
      <span>我的</span>
    </div>
  </div>
</div>
</body></html>
